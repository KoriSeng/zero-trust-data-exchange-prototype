version: "3.8"

services:
  mongodb:
    image: mongo:latest
    container_name: zero-trust-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: zero_trust_db
    volumes:
      - mongodb_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    networks:
      - zero-trust-network

  # Optional: MongoExpress for database GUI
  mongo-express:
    image: mongo-express:latest
    container_name: zero-trust-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: pass
    depends_on:
      - mongodb
    networks:
      - zero-trust-network

volumes:
  mongodb_data:

networks:
  zero-trust-network:
    driver: bridge
