version: "3.8"

services:
  mongodb:
    image: mongo:latest
    container_name: zero-trust-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: zero_trust_db
    volumes:
      - mongodb_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    networks:
      - zero-trust-network

  # Optional: MongoExpress for database GUI
  mongo-express:
    image: mongo-express:latest
    container_name: zero-trust-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: pass
    depends_on:
      - mongodb
    networks:
      - zero-trust-network

  # LocalStack - AWS services emulation (S3, Step Functions, etc.)
  localstack:
    image: localstack/localstack:latest
    container_name: zero-trust-localstack
    ports:
      - "4566:4566" # Main LocalStack endpoint
      - "4571:4571" # Legacy endpoint (optional)
    environment:
      SERVICES: s3,stepfunctions,iam,logs
      DEBUG: 0

      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    volumes:

      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/localstack-init.sh:/docker-entrypoint-initaws.d/init-aws.sh
    networks:
      - zero-trust-network
    healthcheck:
      test: ["CMD", "awslocal", "s3", "ls"]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  mongodb_data:

networks:
  zero-trust-network:
    driver: bridge
